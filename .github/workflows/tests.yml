name: Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: mingyibot_test
          MYSQL_USER: mingyi_test
          MYSQL_PASSWORD: ci-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s --health-timeout=5s --health-retries=30
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mingyibot_test
          POSTGRES_USER: mingyi_test
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mingyi_test -d mingyibot_test"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      INTEGRATION_DB: "1"
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: mingyibot_test
      MYSQL_USER: mingyi_test
      MYSQL_PASSWORD: ci-test-only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: mingyibot_test
      POSTGRES_USER: mingyi_test
      POSTGRES_PASSWORD: ci-test-only
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests
