services:
  bot:
    image: mingyibot:local
    build:
      context: .
      args:
        MINGYI_VERSION: "${MINGYI_VERSION:-dev}"
    container_name: mingyi-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: "${TZ:-Asia/Hong_Kong}"
      DRIVER: "~fastapi"
      HOST: "0.0.0.0"
      PORT: "8080"
      COMMAND_START: '["/"]'
    ports:
      - "${BOT_PORT:-8080}:8080"
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - app_network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1', 8080), 5); s.close()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  app_network:
    driver: bridge
